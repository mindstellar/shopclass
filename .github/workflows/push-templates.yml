# Sends the English source strings to the translations repository.
#
# Translators work from whatever is published there, so until this ran the
# templates were copied across by hand -- which is how they came to sit at 1399
# strings while core had 2280, with nothing anywhere reporting the gap.
#
# Only the three files core generates are pushed. theme.pot belongs to the themes,
# which are their own repositories, and locale.json is a maintainer's configuration
# rather than anything extracted from here.
#
# Only develop publishes. A prerelease install fetches translations from develop and
# a stable one from master (see osc_get_i18n_repository_url()), but templates go to
# develop alone: that is where translators work, so new strings reach them while the
# release is still being built. shopclass-i18n's master takes its develop as it stands
# at a release and is never written to in between -- a template commit pushed there
# directly would be a commit its develop lacks, and the release merge would conflict.
name: Publish translation templates

on:
  push:
    branches: [develop]
    paths:
      - 'oc-content/languages/core.pot'
      - 'oc-content/languages/messages.pot'
      - 'oc-includes/osclass/installer/mail.json'
  workflow_dispatch:

jobs:
  publish:
    # A manual run from any other branch would publish there; only develop publishes.
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shopclass
        uses: actions/checkout@v7

      - name: Checkout translations
        uses: actions/checkout@v7
        with:
          repository: mindstellar/shopclass-i18n
          # A deploy key rather than a token: this job is meant to run unattended for
          # years, and an expiring credential fails by quietly leaving translators on
          # stale templates -- the exact thing this job exists to prevent. A deploy
          # key does not expire and reaches only this one repository.
          ssh-key: ${{ secrets.I18N_DEPLOY_KEY }}
          ref: ${{ github.ref_name }}
          path: i18n

      - name: Copy the templates across
        run: |
          cp oc-content/languages/core.pot      i18n/src/templates/core.pot
          cp oc-content/languages/messages.pot  i18n/src/templates/messages.pot
          cp oc-includes/osclass/installer/mail.json i18n/src/templates/mail.json

      - name: Push if anything changed
        working-directory: i18n
        run: |
          if git diff --quiet -- src/templates/; then
            echo "Templates already match; nothing to publish."
            exit 0
          fi

          echo "Publishing:"
          git diff --stat -- src/templates/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/
          git commit -m "Templates from shopclass@${GITHUB_SHA:0:8}"
          # Crowdin's pull requests and the re-merge bot also push to develop over
          # there. Rebase onto whatever landed first and retry rather than drop the
          # templates.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 5))
          done
          echo "could not publish the templates after 5 attempts"
          exit 1
