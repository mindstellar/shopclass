name: Release Workflow
on:
  push:
    branches:
      - develop
      - master
permissions:
  contents: write
jobs:
  # Gate the release on the same checks that run for PRs (reusable workflows).
  test:
    uses: ./.github/workflows/test.yml
  drift:
    uses: ./.github/workflows/schema-drift.yml

  release:
    needs: [test, drift]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract OSCLASS_VERSION
        id: extract_version
        run: |
          RAW_VERSION=$(grep -oP "(?<=define\\('OSCLASS_VERSION', ')[^']+" oc-includes/osclass/default-constants.php)
          # Validate version and extract major.minor.patch and optional suffix
          if [[ "${RAW_VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.(dev[0-9]*|beta[0-9]*|rc[0-9]*))?$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            SUFFIX="${BASH_REMATCH[2]}"
            echo "OSCLASS_VERSION=${RAW_VERSION}" >> $GITHUB_ENV
            echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
            echo "SUFFIX=${SUFFIX}" >> $GITHUB_ENV
            echo "Extracted version: ${RAW_VERSION}, Base: ${BASE_VERSION}, Suffix: ${SUFFIX}"
          else
            echo "Invalid OSCLASS_VERSION format: ${RAW_VERSION}"
            exit 1
          fi
          # Branch decides the release type; a mismatch publishes nothing.
          # develop -> prereleases only (suffix required); master -> stable only (no suffix).
          SHOULD_RELEASE=false
          if [[ "${GITHUB_REF_NAME}" == "develop" && -n "${SUFFIX}" ]]; then
            SHOULD_RELEASE=true
          elif [[ "${GITHUB_REF_NAME}" == "master" && -z "${SUFFIX}" ]]; then
            SHOULD_RELEASE=true
          fi
          echo "SHOULD_RELEASE=${SHOULD_RELEASE}" >> $GITHUB_ENV
          echo "Branch: ${GITHUB_REF_NAME}, ShouldRelease: ${SHOULD_RELEASE}"

      - name: Skip release (branch/version mismatch)
        if: ${{ env.SHOULD_RELEASE != 'true' }}
        run: |
          echo "No release for ${OSCLASS_VERSION} on ${GITHUB_REF_NAME}."
          echo "develop publishes prereleases (suffix required); master publishes stable (no suffix)."

      - name: Check if Tag Exists
        id: check_tag
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        shell: bash
        run: |
          git fetch --tags --quiet
          if git tag --list "${OSCLASS_VERSION}" | grep -q "^${OSCLASS_VERSION}$"; then
            echo "Tag ${OSCLASS_VERSION} already exists. Skipping release."
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Tag ${OSCLASS_VERSION} does not exist. Proceeding with release."
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Stop if Tag Exists
        if: ${{ env.TAG_EXISTS == 'true' }}
        run: echo "Tag already exists. Exiting."

      - name: Create Release Tag
        if: ${{ env.SHOULD_RELEASE == 'true' && env.TAG_EXISTS == 'false' }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag -a "${OSCLASS_VERSION}" -m "Release ${OSCLASS_VERSION}"
          git push origin "${OSCLASS_VERSION}"

      - name: Setup Node
        if: ${{ env.SHOULD_RELEASE == 'true' && env.TAG_EXISTS == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build assets
        if: ${{ env.SHOULD_RELEASE == 'true' && env.TAG_EXISTS == 'false' }}
        run: |
          npm ci
          npm run build

      - name: Package release
        if: ${{ env.SHOULD_RELEASE == 'true' && env.TAG_EXISTS == 'false' }}
        run: bash ./.build.sh

      - name: Create GitHub Release
        if: ${{ env.SHOULD_RELEASE == 'true' && env.TAG_EXISTS == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          files: release/osclass_v${{ env.OSCLASS_VERSION }}.zip
          tag_name: ${{ env.OSCLASS_VERSION }}
          name: Release ${{ env.OSCLASS_VERSION }}
          prerelease: ${{ env.SUFFIX != '' }}
