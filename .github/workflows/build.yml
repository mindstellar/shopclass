name: Release Workflow
on:
  push:
    branches:
      - develop
      - master
    # A change to prose cannot alter what gets built or whether it releases:
    # the version this workflow keys off lives in default-constants.php.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
permissions:
  contents: write
jobs:
  # Decide whether this push releases anything at all, before spending a runner
  # on building or packaging. Most pushes to develop are ordinary commits that
  # do not move the version, and for those every step below this is wasted.
  #
  # Note this deliberately does NOT gate the test, drift, and lint jobs: they run
  # on every push to these branches whether or not a release comes out of it, so
  # that a commit landing straight on develop is still verified.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      suffix: ${{ steps.decide.outputs.suffix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Decide whether to release
        id: decide
        shell: bash
        run: |
          RAW_VERSION=$(grep -oP "(?<=define\('OSCLASS_VERSION', ')[^']+" oc-includes/osclass/default-constants.php)
          if [[ ! "${RAW_VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.(dev[0-9]*|beta[0-9]*|rc[0-9]*))?$ ]]; then
            echo "Invalid OSCLASS_VERSION format: ${RAW_VERSION}"
            exit 1
          fi
          SUFFIX="${BASH_REMATCH[2]}"
          echo "version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"

          # Branch decides the release type; a mismatch publishes nothing.
          # develop -> beta/rc only; master -> stable only (no suffix).
          #
          # .dev is the open-development marker: valid, but it publishes nothing.
          # It is what the version sits at between releases, so every ordinary
          # commit on develop carries a suffix without cutting a release.
          SHOULD_RELEASE=false
          if [[ "${GITHUB_REF_NAME}" == "develop" && -n "${SUFFIX}" && "${SUFFIX}" != .dev* ]]; then
            SHOULD_RELEASE=true
          elif [[ "${GITHUB_REF_NAME}" == "master" && -z "${SUFFIX}" ]]; then
            SHOULD_RELEASE=true
          fi

          # An existing tag means this version already shipped. Folded in here so
          # the answer is one output rather than two conditions repeated later.
          if [[ "${SHOULD_RELEASE}" == "true" ]]; then
            git fetch --tags --quiet
            if git tag --list "${RAW_VERSION}" | grep -q "^${RAW_VERSION}$"; then
              echo "Tag ${RAW_VERSION} already exists — nothing to release."
              SHOULD_RELEASE=false
            fi
          else
            echo "No release for ${RAW_VERSION} on ${GITHUB_REF_NAME}."
            echo "develop publishes beta/rc; master publishes stable (no suffix); .dev publishes nothing."
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${RAW_VERSION}, Branch: ${GITHUB_REF_NAME}, Release: ${SHOULD_RELEASE}"

  # These run on every push to develop/master regardless of the gate. They are
  # invoked here rather than triggering themselves on these branches, which is
  # what used to run the whole suite twice for a single push.
  test:
    uses: ./.github/workflows/test.yml
  drift:
    uses: ./.github/workflows/schema-drift.yml
  lint:
    uses: ./.github/workflows/lint.yml
  i18n:
    uses: ./.github/workflows/i18n-drift.yml
  vendor:
    uses: ./.github/workflows/vendor-drift.yml

  release:
    needs: [gate, test, drift, lint, i18n, vendor]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # For the install smoke test below: the zip is installed against a real
    # database before it is allowed to become a release.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      OSCLASS_VERSION: ${{ needs.gate.outputs.version }}
      SUFFIX: ${{ needs.gate.outputs.suffix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Build and package BEFORE tagging: the tag is created only by a successful
      # release (below), so a failed build can never leave a dangling tag that blocks
      # the next run.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Package release
        # Archive from the pushed commit, not a tag — the tag does not exist yet.
        env:
          OSCLASS_REF: ${{ github.sha }}
        run: bash ./.build.sh

      # deprecated-api.json and package-lint.php are the registry's copy of the
      # package contract (docs/MARKET.md §6.3-6.4): the registry CI downloads
      # both from this release rather than keeping its own, so they must ship
      # as release assets alongside the zip, not folded into it. Generating the
      # inventory needs nothing beyond Node, already set up above.
      - name: Generate deprecated API inventory
        run: node scripts/gen-deprecated-api.mjs --out=deprecated-api.json

      # The package-CI harness (docs/MARKET.md §6) — the registry repos' PR
      # validation downloads one bundle rather than several loose files, because
      # package-lint.php looks for Compatibility.php beside itself first (only
      # falling back to --compat= otherwise), so a flat layout is what makes the
      # "just extract and run" story work. The standalone assets below keep
      # shipping unchanged; this is additive, not a replacement.
      - name: Build package-ci bundle
        run: |
          set -euo pipefail
          rm -rf package-ci
          mkdir -p package-ci/deprecation-collector
          cp tools/package-lint.php package-ci/
          cp oc-includes/osclass/classes/market/Compatibility.php package-ci/
          cp deprecated-api.json package-ci/
          cp tools/ci/deprecation-scan.php package-ci/
          cp tools/ci/annotate.php package-ci/
          cp tools/ci/smoke-install.sh package-ci/
          cp tools/ci/build-catalog.php package-ci/
          cp tools/ci/deprecation-collector/index.php package-ci/deprecation-collector/
          tar czf shopclass-package-ci.tar.gz package-ci

      # Pinned rather than taking whatever the runner happens to ship: the smoke
      # test needs mysqli both for the app and to prepare the database, and the
      # preinstalled PHP carries no guarantee of it.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, intl, gd, curl, zip

      # Everything else tests the repository. This tests the artefact: unpack the
      # zip a site owner would download, run the installer against a real
      # database, and sign in. A file the archive missed, a build artefact that
      # was never committed, or an installer step that only fails on a clean
      # database is invisible to every other check in this pipeline, and would
      # otherwise be found by whoever downloaded the release.
      - name: Install smoke test
        env:
          SMOKE_DB_HOST: 127.0.0.1
          SMOKE_DB_PORT: 3306
          SMOKE_DB_USER: root
          SMOKE_DB_PASS: root
        run: bash tests/install-smoke.sh "release/osclass_v${OSCLASS_VERSION}.zip"

      - name: Extract release notes from CHANGELOG
        run: |
          # The release body is a SHORT summary, not the whole changelog: the
          # top-most "## <version>" heading plus the intro paragraph that follows
          # it, up to the first "### <group>" heading (or the next release). The
          # full categorised bullet list stays in CHANGELOG.md and is linked
          # below — a single accumulating section (every beta lands under one
          # "## <version>") would otherwise dump hundreds of lines into a release.
          awk 'BEGIN{n=0} /^## [^#]/{n++; if (n==2) exit} n>=1 && /^### /{exit} n>=1{print}' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See the commit history for changes in this release." > release_notes.md
          fi
          # Link the tag, not the branch: the branch ref moves, but "${OSCLASS_VERSION}"
          # is tagged by this same run, so the link keeps resolving to the notes for
          # exactly this release.
          printf '\n\nFull changelog: https://github.com/mindstellar/shopclass/blob/%s/CHANGELOG.md\n' "${OSCLASS_VERSION}" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The zip's name/shape is the self-updater's compatibility contract
          # with old installs — it is uploaded as-is. deprecated-api.json,
          # package-lint.php, Compatibility.php, and the package-ci bundle that
          # re-packages them (plus the rest of tools/ci/) are separate assets
          # alongside it, never merged in.
          files: |
            release/osclass_v${{ env.OSCLASS_VERSION }}.zip
            deprecated-api.json
            tools/package-lint.php
            oc-includes/osclass/classes/market/Compatibility.php
            shopclass-package-ci.tar.gz
          tag_name: ${{ env.OSCLASS_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.OSCLASS_VERSION }}
          body_path: release_notes.md
          prerelease: ${{ env.SUFFIX != '' }}

  # Publish the production container image for the same release. Runs only after
  # the release job (its install smoke test gates the app), so an image is only
  # ever pushed for a validated release. A failure here is visible but does not
  # undo the GitHub release that already published above.
  docker:
    needs: [gate, release]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OSCLASS_VERSION: ${{ needs.gate.outputs.version }}
      SUFFIX: ${{ needs.gate.outputs.suffix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The image carries the exact core version (e.g. 6.0.0.rc2), plus one moving
      # alias: the channel (dev/beta/rc) for a prerelease, or latest for a stable
      # release. So `:rc` always points at the newest rc, `:latest` at the newest
      # stable — mirroring the version scheme the release itself uses.
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:${OSCLASS_VERSION}"
          if [ -n "${SUFFIX}" ]; then
            CHANNEL=$(printf '%s' "${SUFFIX}" | sed -E 's/^\.//; s/[0-9]+$//')
            TAGS="${TAGS},${IMAGE}:${CHANNEL}"
          else
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Image tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ env.OSCLASS_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Pre-release image channel: publish a moving :edge tag WITHOUT cutting a
  # versioned release. This is opt-in per push — it runs only when the head
  # commit message contains the marker [publish-edge] — so ordinary develop
  # commits never republish the image, and a deliberate one does. Gated on the
  # same test/drift/lint as a release so a broken commit can never ship an image.
  edge:
    needs: [test, drift, lint, i18n, vendor]
    if: github.ref_name == 'develop' && contains(github.event.head_commit.message, '[publish-edge]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Compute image name
        id: img
        shell: bash
        run: echo "image=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :edge
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.image }}:edge
          provenance: false
          labels: |
            org.opencontainers.image.version=edge
            org.opencontainers.image.revision=${{ github.sha }}
