# GitHub Action for Shopclass
name: Lint PHP
on:
  # develop and master are excluded here because the release workflow calls this
  # one for those branches (mirroring test.yml). Without that, a push to either
  # would lint twice: once from this trigger and once as a called job.
  push:
    branches-ignore:
      - develop
      - master
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  workflow_call:

jobs:
  lint:
    name: PHP format + 8.0 floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # The PHP 8.0 floor is enforced because config.platform is 8.0.0: a real install
      # fails on any locked package that needs more. `check-platform-reqs` is not used,
      # as it compares against the runner's own PHP and would pass a lock needing 8.3.
      - name: Dependencies still resolve against the PHP floor
        run: |
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --prefer-dist

      # The formatter is a pinned PHAR rather than a composer dep, so that it
      # never lands in the committed oc-includes/vendor tree shipped in the zip.
      # The pin is in composer.json's cs:install, the same one a developer runs.
      - name: Fetch php-cs-fixer
        run: composer cs:install

      # The one-time reformat left the whole tree clean, so this is a full-tree
      # dry-run: any drift is a real failure, not pre-existing debt to skip.
      - name: Check formatting (PSR-12)
        run: composer cs:check

      # PHPCompatibility lives in its own project for the same vendor reason.
      - name: Install compatibility linter
        run: composer lint:install

      - name: Check PHP 8.0 floor
        run: composer compat

      # Old findings sit in phpstan-baseline.neon; new code must be clean.
      - name: Static analysis (PHPStan)
        run: composer analyse

      # A write that resolves to the inherited DAO reports failure by returning false,
      # which reads as success inside a transaction and commits everything before it.
      # Grepping for the query helpers cannot find these — the call that shipped this
      # bug was `parent::deleteByPrimaryKey($id)`, with no query in sight.
      - name: No legacy DAO write inside a transaction
        run: php tools/ci/legacy-dao-in-transaction.php
