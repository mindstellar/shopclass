# Verifies that a fresh install (struct.sql) and an upgraded install
# (last release's struct.sql -> updateDB -> migrations) converge to the
# same database schema. A failure means struct.sql changed in a way the
# upgrade path does not reproduce — i.e. a migration is owed.
name: Schema Drift
on:
  # develop and master are excluded here because the release workflow calls this
  # one for those branches. Without that, a push to either ran this twice: once
  # from this trigger and once as a called job.
  #
  # paths-ignore covers this trigger and pull_request only, never workflow_call
  # — a release always runs the full check whatever it touched.
  push:
    branches-ignore:
      - develop
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  workflow_call:
jobs:
  drift:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout (full history for release tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Resolve baseline (latest stable release tag)
        id: baseline
        run: |
          TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TAG" ]; then
            echo "::notice::No stable release tag found — skipping schema-drift check (no baseline to diff against yet)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using baseline tag: $TAG"
          git show "$TAG:oc-includes/osclass/installer/struct.sql" > /tmp/baseline-struct.sql
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Schema drift check (baseline ${{ steps.baseline.outputs.tag }} -> current)
        if: ${{ steps.baseline.outputs.skip != 'true' }}
        env:
          DRIFT_DB_HOST: 127.0.0.1
          DRIFT_DB_USER: root
          DRIFT_DB_PASS: root
        run: php tests/schema-drift.php /tmp/baseline-struct.sql
