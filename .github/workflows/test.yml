# GitHub Action for Shopclass
name: Test PHP
on:
  # develop and master are excluded here because the release workflow calls this
  # one for those branches. Without that, a push to either ran the whole suite
  # twice: once from this trigger and once as a called job.
  #
  # paths-ignore covers this trigger and pull_request only, never workflow_call
  # — a release always runs the full suite whatever it touched.
  push:
    branches-ignore:
      - develop
      - master
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  workflow_call:
jobs:
  tests:
    name: parse (PHP ${{ matrix.php-versions }})
    strategy:
      # One version failing must not cancel the others: knowing a file parses on
      # 8.3 but not on 8.5 is the entire point of running more than one.
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: [ '8.0', '8.1', '8.3', '8.4', '8.5' ]
        experimental: [false]
        include:
          # Unreleased PHP, for information only. It reports what is coming --
          # a construct deprecated in the next version, or one already removed
          # -- without a build breaking because upstream changed something in
          # a build nobody runs in production yet.
          - operating-system: ubuntu-latest
            php-versions: 'nightly'
            experimental: true
    runs-on: ${{ matrix.operating-system }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
      # Fails on a parse error, reports deprecations without failing. `php -l`
      # already draws that line by exit code; what it does not do is separate
      # them in its output, so across a thousand files the deprecations were
      # printed and lost. See tests/php-lint.sh.
      - name: Parse check
        run: bash tests/php-lint.sh

  # Characterization tests for the DAO base layer and the models built on it.
  # These pin observable behaviour against a live database so that rewriting a
  # model's query layer is provably behaviour-preserving.
  model-contracts:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --tmpfs /var/lib/mysql
    env:
      DRIFT_DB_HOST: 127.0.0.1
      DRIFT_DB_PORT: 3306
      DRIFT_DB_USER: root
      DRIFT_DB_PASS: root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
      # Scratch data needs no crash safety; without disk syncs the suite runs several times faster.
      - name: Fast scratch database
        run: php -r '$db = new mysqli("127.0.0.1", "root", "root", "", 3306); $db->query("SET GLOBAL innodb_flush_log_at_trx_commit = 0"); $db->query("SET GLOBAL sync_binlog = 0");'
      # oc-includes/vendor/ is committed (releases are cut with git archive and
      # run no build step), so the autoloader is present straight from checkout.
      - name: Params typed accessors
        run: php tests/params-typed-accessors.php
      - name: Browser photo resize config
        run: php tests/browser-resize-config.php
      - name: Admin two-step codes
        run: php tests/totp.php
      - name: API request and response
        run: php tests/api-request-response.php
      - name: API cursors
        run: php tests/api-cursor.php
      - name: API schema validator
        run: php tests/api-validator.php
      - name: API router
        run: php tests/api-router.php
      - name: API plugin contract and field codes
        run: php tests/api-contract.php
      - name: API authentication
        run: php tests/api-auth.php
      - name: API ignores browser identity
        run: php tests/api-web-identity.php
      - name: API CORS
        run: php tests/api-cors.php
      - name: API OpenAPI document
        run: php tests/api-openapi.php
      - name: API OpenAPI cache
        run: php tests/api-openapi-cache.php
      - name: API query parameters
        run: php tests/api-query-params.php
      - name: API serializers
        run: php tests/api-serializers.php
      - name: API plugin fields
        run: php tests/api-extensions.php
      - name: API listing query
        run: php tests/api-listing-query.php
      - name: API sign-in tokens
        run: php tests/api-tokens.php
      - name: API Idempotency-Key
        run: php tests/api-idempotency.php
      - name: API If-Match
        run: php tests/api-if-match.php
      - name: API listing form
        run: php tests/api-listing-body.php
      - name: API request counter
        run: php tests/api-apcu-counter.php
      - name: Account form input
        run: php tests/account-input.php
      - name: Status flag order
        run: php tests/status-flags.php
      - name: Admin menu highlight
        run: php tests/admin-menu-current.php
      - name: Listing live rule and actor
        run: php tests/listing-status.php
      - name: Listing view and manage policy
        run: php tests/item-access.php
      - name: API webhooks
        run: php tests/api-webhooks.php
      - name: API request id and password-grant switch
        run: php tests/api-request-id.php
      - name: API skips the theme
        run: php tests/api-skips-theme.php
      - name: Held e-mails after a commit
        run: php tests/deferred-mail.php
      - name: Old backup class names
        run: php tests/backup-aliases.php
      - name: .htaccess refresh and reserved slugs
        run: php tests/server-rules.php
      - name: WebP images
        run: php tests/image-webp.php
      - name: Photo colours
        run: php tests/image-colour.php
      # Storefront -- the default theme -- keeps its chrome in common/, so a probe
      # for a root header.php/footer.php missed on a default install and every
      # core-rendered page dropped to the standalone shell.
      - name: Theme chrome resolution
        run: php tests/theme-chrome.php
      # The reserved view names guard static-page slugs, and both directions are
      # silent: a name added forbids a slug live sites already use, and one dropped
      # lets a page shadow the route of the same name and quietly stop resolving.
      - name: Theme view names
        run: php tests/theme-views.php
      # Controllers now name a list of views rather than one, and the two orderings
      # have to resolve theme-first: if candidate order won outright, a fallback
      # theme's specific view would beat the active theme's generic one and the
      # visitor would silently get a page from a theme the site is not running.
      - name: Template hierarchy
        run: php tests/template-hierarchy.php
      # osc_head() ends by running the `header` hook, which carries every enqueued
      # asset and the robots meta. Running it twice ships every asset twice and
      # dropping it ships an unstyled page — the page renders through either way.
      - name: Head and body ownership
        run: php tests/theme-head.php
      - name: Captcha posted token
        run: php tests/captcha-posted-token.php
      # PHPMailer's default wait is 300s; a dead SMTP host then pins a php-fpm worker
      # for five minutes per send. The cap is a filter with a 1–60 clamp.
      - name: PHPMailer SMTP timeout
        run: php tests/phpmailer-smtp-timeout.php
      - name: Maintenance mode helpers
        run: php tests/maintenance-mode.php
      - name: Rewrite param decode
        run: php tests/rewrite-param-decode.php
      - name: Rewrite route match
        run: php tests/rewrite-route-match.php
      - name: Rewrite resolve rewrite
        run: php tests/rewrite-resolve-rewrite.php
      # Core page URLs and the rules that answer them come from one table. Pins both
      # ends: a link changed on its own is a broken link in an email already sent.
      - name: Core routing
        run: php tests/core-routing.php
      # Which controller answers each ?page= value, on the site and in the admin.
      - name: Page dispatch
        run: php tests/page-dispatch.php
      # Every filter link, facet and canonical tag on the public site comes out of
      # osc_search_url(). Pins its output, quirks included.
      - name: Search URLs
        run: php tests/search-url.php
      # The eight alert_email_* filters are a published contract: a plugin rewrites
      # a digest through them. Pins the names, their order and what each is handed.
      - name: Alert emails
        run: php tests/alert-emails.php
      # Core finds a template to send by its internal name, so a save must never rename it.
      - name: Email template save
        run: php tests/admin-email-save.php
      # A plugin adds oc-cli.php commands through a filter; it must never replace a core one.
      - name: CLI commands filter
        run: php tests/cli-commands-filter.php
      # Every mail used to go out HTML-only: the plain copy each builder handed over
      # was never read. Pins the conversion, and that link addresses survive it.
      - name: Mail plain-text copy
        run: php tests/mail-plain-text.php
      # An English install reads the language copy; the translations repository is fed
      # the installer copy. Fixing one and not the other goes unnoticed without this.
      - name: Email templates match in both copies
        run: diff oc-content/languages/en_US/mail.json oc-includes/osclass/installer/mail.json
      # page=route takes the hook name from the request. Unchecked, anyone can fire cron_hourly.
      - name: Route hook dispatch
        run: php tests/route-hook-dispatch.php
      - name: Symlinked plugin paths
        run: php tests/plugin-path-symlink.php
      - name: Private-network address guard
        run: php tests/address-guard.php
      - name: Proxy IP mismatch detection
        run: php tests/proxy-ip-mismatch.php
      - name: Theme list and preview allowlist
        run: php tests/theme-preview.php
      - name: Plugin screen headers
        run: php tests/admin-plugin-page.php
      - name: README renderer
        run: php tests/market-markdown.php
      # A priority outside the old 0-10 loop was stored and never run, with no warning.
      - name: Hook priority
        run: php tests/hook-priority.php
      # Plugins on sites we cannot see register against these names, so a rename has to
      # be a deliberate edit of the fixture rather than a silent break.
      - name: Hook name pin
        run: php tests/hook-contract.php
      # The REST API builds on core; core reaches it only through ApiAccess.
      - name: Core does not import the API
        run: php tests/core-no-api-import.php
      # Table SQL lives in the table's model or store, not in services and controllers.
      - name: No raw table access
        run: php tests/no-raw-table-access.php
      # Paging params come straight from a URL; a bad one used to 500 the screen.
      - name: Admin list paging
        run: php tests/admin-list-paging.php
      - name: Currency and country codes
        run: php tests/iso-codes.php
      # One loop behind 21 bulk actions; the counts it reports used to be wrong three ways.
      - name: Admin bulk actions
        run: php tests/admin-bulk-apply.php
      # ajax_photos[] names become paths, and every temp file handed in is unlinked after.
      - name: Ajax photo attach
        run: php tests/ajax-photo-attach.php
      # The hooks reference is generated, so it cannot drift from what core fires.
      - name: Hooks reference is current
        run: php tools/gen-hooks-doc.php --check
      # The OpenAPI file and the endpoint reference are generated from the route table.
      - name: OpenAPI document is current
        run: php tools/gen-openapi.php --check
      - name: API reference is current
        run: php tools/gen-api-doc.php --check
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The OpenAPI rules a client generator or gateway relies on, beyond what core checks.
      - name: OpenAPI document passes Redocly lint
        run: npx -y @redocly/cli@2.57.0 lint docs/site/developers/api/openapi.json
      # Copying the upload stored whatever was appended after the image, under a .jpg name.
      - name: Keep-original re-encodes
        run: php tests/keep-original-reencode.php
      - name: Item URL characterization
        run: php tests/item-url-characterization.php
      - name: Pagination
        run: php tests/pagination.php
      - name: Installer config values
        run: php tests/install-config.php
      - name: Request host keeps its port
        run: php tests/request-host.php
      - name: Params XSS check matches the purifier
        run: php tests/params-purify.php
      - name: HTMLPurifier definition cache
        run: php tests/purifier-cache.php
      - name: Mail attachments come only from real uploads
        run: php tests/mail-upload-attachment.php
      # The location sitemaps synthesise URLs while the sitemap route's own params are
      # still in the request; one leaking in silently doubles every category-location
      # page into a second, self-canonicalising URL that Google indexes separately.
      - name: Sitemap search URLs
        run: php tests/sitemap-search-url.php
      # A token in a GET form lands in the query string: shared in links, kept in
      # referrers, and unique per visitor, so every search URL becomes its own cache
      # entry. Skipping a POST form is worse -- its action rejects every submission.
      - name: CSRF form injection
        run: php tests/csrf-form-injection.php
      # Comments are on by default, so a renamed field or a dropped hook here breaks
      # posting on every theme that uses core's block, with nothing to see on the page.
      - name: Item comments view
        run: php tests/item-comments-view.php
      # The edit form posts title[<locale>]. Report the wrong one and saving copies the
      # text it was showing into a second locale, leaving the original untranslated --
      # once per edit, with nothing to see on the page.
      - name: Item content locale
        run: php tests/item-content-locale.php
      # A description that leads with the category blurb reads fine on one page and is a
      # duplicate across every city in that category -- the part that differs sits past
      # where a search engine stops reading.
      - name: Meta description
        run: php tests/meta-description.php
      # Both directions are silent: a facet param left in the canonical makes every price
      # and custom-field permutation its own indexable URL, and one dropped too many points
      # two different result sets at the same canonical, de-indexing one of them.
      - name: Canonical params
        run: php tests/canonical-params.php
      # The request normalisation CWebSearch::doModel() used to do inline, now a builder
      # both the live controller and (later) alert replay share -- splitting, arrays,
      # empty values, strip_tags, the search_pattern filter, bPic/bPremium coercion.
      - name: Search criteria normalisation
        run: php tests/search-criteria.php
      # A saved alert is stored as search values in one canonical string (it is also the
      # de-duplication key); anything else, SQL included, must fail validation.
      - name: Alert envelope
        run: php tests/alert-envelope.php
      # Old alerts held SQL fragments. The upgrade reads back only the exact fragments core
      # wrote; anything else must be held, never guessed into a search.
      - name: Legacy alert parser
        run: php tests/alert-legacy-parser.php
      - name: Custom field escaping
        run: php tests/item-meta-escape.php
      # Resolving sCategory by slug alone 404s a category that exists whenever the value
      # is an id -- which is what osc_search_url() emits and what a category <select> submits.
      - name: Search category resolution
        run: php tests/search-category-resolve.php
      # Themes read the search page's view exports and plugins listen on its hooks; a
      # refactor that drops or reorders one breaks them silently.
      - name: Search exports contract
        run: php tests/search-exports-contract.php
      # Every friendly search URI shape: category, page, region, city, former slug, 404.
      - name: Search URI resolver
        run: php tests/search-uri-resolver.php
      # A page built from blocks rendered through the theme's root header.php, which is not
      # part of the view contract -- the page shipped as a fragment with no <head> at all.
      - name: Page builder render
        run: php tests/page-builder-render.php
      # A declared settings page is the one place a plugin's admin form is not its own
      # code: a spec error accepted here is a field silently missing from the page, and a
      # value stored past its declared options is one nothing downstream expects.
      - name: Settings page registry
        run: php tests/settings-page-registry.php
      # An image field replaces, removes and refuses uploads; a front-end call must never upload or delete.
      - name: Settings image field
        run: php tests/settings-image-field.php
      - name: Image resize fit
        run: php tests/image-resize-fit.php
      # The lifecycle hooks are what let a side effect (rewriting .htaccess, writing
      # robots.txt) attach to a declared save: a hook or an inline after_save firing on a
      # rejected submission, firing twice, or seeing the raw request instead of the
      # validated values would all be silent until a page actually used one. The two
      # filters are pinned as filters -- run as hooks they hand the listener a copy and
      # its derived value or edited field spec is dropped without a word. The write set is
      # pinned to the declared field names for the same reason: before_save hands a listener
      # the whole value array, so a write loop walking that array instead of the declaration
      # would let any listener store an arbitrary preference under any page's section.
      - name: Admin form lifecycle hooks
        run: php tests/admin-form-lifecycle-hooks.php
      # osc_admin_form() is sugar over the spec array osc_register_settings_page() already
      # takes, so the two front doors have to keep emitting the same thing. Every way they
      # can drift is silent: a modifier writing the wrong key is a field that renders
      # without its hint or is never rejected as empty, and a builder that stopped handing
      # the array to the registry would accept a spec the array form still refuses.
      - name: Admin form builder
        run: php tests/admin-form-builder.php
      # 'depends' and 'translate' are schema features, so both halves have to agree. The
      # dependent half is the security one: the client script only hides a row, and a field
      # whose master is off must have its posted value discarded and must not be required,
      # or a row the browser never showed becomes a value anyone can set by hand. The
      # translated half fails just as quietly -- a control reading or writing a key the
      # store does not use drops what was typed with nothing on screen to show for it.
      # The dependent half is driven in the runner's Chrome against the committed ui-osc.js
      # and main.css, because a source grep cannot tell a script that runs from one that is
      # merely present; the browser half is skipped where there is no Chrome to run it.
      # The browser is a dependency of that suite, so it is named here rather than assumed
      # of the runner image: with CI set the suite fails instead of skipping, and this step
      # says which build ran.
      - name: Browser for the driven assertions
        run: |
          for b in "$CHROME" google-chrome google-chrome-stable chromium chromium-browser; do
            [ -n "$b" ] && command -v "$b" >/dev/null 2>&1 && exec "$b" --version
          done
          echo "no chrome/chromium on PATH; the driven assertions would skip" >&2
          exit 1
      - name: Admin form depends and translate
        run: php tests/admin-form-depends-translate.php
      # Custom-field labels and date inputs, and the #plugin-hook loader driven in Chrome.
      - name: Item form custom fields
        run: php tests/item-form-custom-fields.php
      # The enabled-locale list is memoised for the request, so a locale added, enabled,
      # disabled or deleted leaves every translated field on the page working from the list
      # as it was -- and the languages screen redirects to itself, so the stale row is the
      # first thing shown. The source scan derives the writing actions from the controller,
      # so a new one is held to the same rule rather than being exempt for being new.
      - name: Locale cache invalidation
        run: php tests/locale-cache-invalidation.php
      # The table store is the last step of a declared save, and every way it can be wrong
      # is quiet: deciding insert-vs-update wrongly fills the table with copies of the row
      # being edited, an update naming columns the page never declared erases the half of
      # the entity that screen does not edit, and reading an unchanged update's zero
      # affected rows as failure tells the admin their save did not work when it did --
      # the bug CAdminSettingsKeywordBlock still carries a comment about. It also pins the
      # two rules that keep a bound table from being everyone's: the row written is the one
      # the caller named and never one the request carried, and a key is parsed rather than
      # coerced, because (int) reads ' 12 ' and '12abc' as a real row number. And against a
      # real table it pins the rule that a rejected submission writes no row and runs no
      # after_save, which is what stops Permalinks rewriting .htaccess for a form that
      # failed validation. It drives the generic controller rather than reading it, because
      # a guard that is in the source and never taken is the same install as no guard, and
      # it reads the shared view's rendered form rather than its source, because the key a
      # hidden input would carry is interpolated and so never appears in the file.
      - name: Admin form table store
        run: php tests/admin-form-store.php
      # The ban-rule screen is the first core screen saved by a declaration instead of a
      # hand-written Params::getParam/validate/write block, and every way that can go wrong
      # is quiet. The row a save writes has to be the one the controller derived and
      # checked, not one the submission names; a key that is not a row has to write nothing
      # rather than fall through and insert, which turns an edit screen into one that
      # silently creates rules; the rule spanning two fields ("both cannot be empty") has no
      # field to live on, so losing it fills the table with rules matching nobody; and an
      # unchanged update affects no rows and is still a save. It drives the controller and
      # reads the row back with raw SQL, because a guard in the source that no branch
      # reaches is the same install as no guard.
      - name: Admin ban rule form
        run: php tests/admin-ban-rule-form.php
      # The administrator account screen is a privilege boundary, and every way it can go
      # wrong is quiet. The current-password box is the re-authentication standing between
      # an unattended session and a second administrator, and it is a control that is never
      # stored -- so losing the check in a migration looks identical on screen. The account
      # type is not the edited admin's to set on their own row, or a moderator promotes
      # themselves. A blank new-password box means "leave it alone"; written through, it
      # stores the hash of an empty string and every rename changes a password. And the
      # column has to take the hash while the plaintext survives as far as the welcome
      # email. It drives the controller and reads the row back with raw SQL, because a
      # guard in the source that no branch reaches is the same install as no guard.
      - name: Admin account form
        run: php tests/admin-account-form.php
      # The row-declaration migration dropped the e-mail row's own field and put the
      # mobile field under its label instead, deleting the cell phone row -- so Users ->
      # Add always failed with an invalid-email error.
      - name: Admin user form
        run: php tests/admin-user-form.php
      # The listing and page editors are hand-built screens whose fields nothing declares.
      # A field renamed, dropped or turned into another kind of control is silent: the form
      # draws, the save runs, and the column it fed keeps its old value.
      - name: Admin editor fields
        run: php tests/admin-editor-fields.php
      # The other end of the same contract -- what each field's save actually writes,
      # including both locale rows, which a single-locale check cannot see.
      - name: Admin editor save
        run: php tests/admin-editor-save.php
      # The composites both editors are assembled from. A dropped rail class stops the
      # status panel coming first on a phone; a dropped dirty attribute turns the save bar
      # back into a row that counts nothing.
      - name: Admin editor components
        run: php tests/admin-editor-components.php
      # The twelve settings screens that save through their declarations. Four of their
      # controls keep the name their page's script knows while the value lives under a
      # different preference key -- maxLatestItems@home, defaultResultsPerPage@search,
      # contact_attachment, purge_latest_searches -- so a key spelled wrong saves happily
      # into something nothing reads and the setting silently reverts. Two controls write
      # one preference (comment moderation is -1 or a count, search retention is a preset
      # or a typed number), a blank mail-server password means
      # "leave it alone" rather than "clear it and stop sending mail", and the clamped
      # numbers are clamped rather than refused because a zero sign-in window shuts the form
      # for everyone. Permalinks adds the two save-time effects: the rewrite rules go to disk
      # and the rule cache is rebuilt once on a save and never on a refusal, or a rejected
      # form leaves a .htaccess describing a structure nothing stored. Sitemap writes
      # robots.txt byte for byte (the trim every declared box gets would drop its final
      # newline) and an unwritable file comes back with what was typed instead of being
      # lost to a redirect. Media refuses a watermark that is not a PNG before anything is
      # written, and its form posts multipart, or the upload never reaches the save. Storage
      # blanks any public URL that is not http(s), because it is built into every image a
      # visitor loads, and a blank secret key keeps the stored one or remote storage stops
      # authenticating. It drives the controllers and reads t_preference back with raw SQL.
      - name: Settings screen forms
        run: php tests/settings-screen-forms.php
      # Settings -> API: a key needs the password, is shown once, a moderator cannot grant admin
      # scopes, a public key only reads, and every key action needs the CSRF token.
      - name: API keys screen
        run: php tests/admin-api-keys.php
      # A declared text field is read with the XSS check off, so without the default here
      # every migrated screen stores markup the hand-written controller it replaced had
      # always stripped -- and nothing shows it, because core escapes on the way out
      # either way. What is taken out is measured against Params::getParam()'s live output
      # rather than a transcribed constant. The stored value is escaped, which is what keeps
      # it inert for a plugin that prints it raw, and what makes the length rule count the
      # stored value and not the typed one: a single "&" costs the column five characters,
      # so a purified control is handed no maxlength to promise otherwise.
      - name: Admin form text purification
        run: php tests/admin-form-text-purify.php
      # The admin field primitives are what a plugin builds a settings page from, so their
      # markup is a contract both ways: an unescaped value is stored XSS on an admin-only
      # page, and a dropped field-* class puts a number back to full width, breaking the
      # sentence it sits in.
      - name: Admin field primitives
        run: php tests/admin-field-primitives.php
      # Keeps the row/checkbox/tab primitives unified: no theme copy shadowing core, no
      # hand-written form row creeping back, no return to Bootstrap tabs.
      - name: Admin form primitives guard
        run: php tests/admin-form-primitives-guard.php
      # user_menu_filter is the only way a plugin reaches the account menu, and a wrong
      # order there is silent -- the entry renders, just under the log-out row.
      - name: Account menu order
        run: php tests/user-menu-order.php
