      - name: Backup commands
        run: php tests/cli-backup.php
      # api:key:create, list and revoke; the key is printed once and the list never prints a secret.
      - name: API key commands
        run: php tests/cli-api-keys.php
      # ONLY_FULL_GROUP_BY rejects a grouped query outright, and every one of them is
      # wrapped in a catch that returns an empty array — so a site that turns the strict
      # modes on loses its alert emails, its custom fields and its statistics charts with
      # nothing in any log. The modes are SET by hand here because MariaDB's defaults omit
      # ONLY_FULL_GROUP_BY entirely and the file would otherwise pass without testing it.
      - name: Strict SQL mode
        run: php tests/db-strict-mode.php
      - name: Connection setup
        run: php tests/db-connect-setup.php
      - name: Strict mode readiness
        run: php tests/db-strict-readiness.php
      # DAO::insertGetId() answers 0 on a rejected write and DAO::update() answers
      # false, so an unchecked return turned a refused registration into "check your
      # inbox" for an account that was never created. Nothing throws, nothing logs,
      # and the failure only appears when someone types a postcode one character too
      # long — which is also why the column widths are pinned against the live schema.
      - name: Strict write guards
        run: php tests/strict-write-guards.php
      # A balance read and written back loses a concurrent top-up; increment() cannot.
      - name: QueryBuilder writes
        run: php tests/querybuilder-writes.php
      - name: QueryBuilder reads
        run: php tests/querybuilder-reads.php
      # The upgrade screen and upgradeDB() are replaced at different moments — an
