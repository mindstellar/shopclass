      - name: Location admin view
        run: php tests/location-admin-view.php
      # Repair is offered and run only when something is fixable, and old Tools URLs resolve.
      - name: Admin database page
        run: php tests/admin-database-page.php
      # System info: the verdict's tone and order, each issue's action, the backup and cron rules.
      - name: System checks
        run: php tests/system-checks.php
      # System info tabs, the old Database URL redirect, the menu, and the update and Repair posts.
      - name: Admin system info page
        run: php tests/admin-system-info-page.php
      # A script is split statement by statement from a stream, quoted values intact.
      - name: SQL stream
        run: php tests/sql-stream.php
      # A backup zip survives a stop between runs, never follows a link out of the site,
      # and a restore writes only under oc-content.
      - name: Backup archive
        run: php tests/backup-archive.php
      # A newer backup, or an old dump with another table prefix, is refused before anything changes.
      - name: Backup manifest
        run: php tests/backup-manifest.php
      # Backups run in batches and can be cancelled; a failed restore puts the safety copy back.
      - name: Backup jobs
        run: php tests/backup-jobs.php
      # Old backup URLs route, the demo refuses first, and downloads take listed names only.
      - name: Admin backup page
        run: php tests/admin-backup-page.php
      # Every admin ajax action reaches its handler, with the same token and moderator rules.
      - name: Admin ajax dispatch
        run: php tests/admin-ajax-dispatch.php
      # Bucket backup keys carry a random name and a manifest; the prune keeps N per kind there too.
      - name: Backup S3 keys
        run: php tests/backup-s3-keys.php
