      - name: Email validation
        run: php tests/validate-email.php
      # The username availability check stripped dots that registration keeps.
      - name: Sanitize drift
        run: php tests/sanitize-drift.php
      - name: Typed-row parity
        run: php tests/db-typed-rows.php
      - name: Secret-comparison regression
        run: php tests/security-secret-coercion.php
      # An unauthenticated alert token is the whole bug: the fix these pin is invisible from
      # the outside, so a regression reads as a working unsubscribe link that anyone can forge.
      - name: Alert token crypto
        run: php tests/alert-token-crypto.php
      # The custom ajax action once ran any file under oc-content/plugins. A regression is a
