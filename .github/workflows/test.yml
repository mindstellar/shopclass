      - name: Test gateway
        run: php tests/test-gateway.php
      - name: Delete cascades
        run: php tests/delete-cascade.php
      # Upgrades run migrations only; db:repair is the opt-in reconciler.
      - name: Schema repair
        run: php tests/schema-repair.php
      # A backup is written and restored without holding a table in memory.
      - name: Backup and restore
        run: php tests/backup-restore.php
