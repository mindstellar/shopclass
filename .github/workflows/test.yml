# GitHub Action for Shopclass
name: Test PHP
on:
  # develop and master are excluded here because the release workflow calls this
  # one for those branches. Without that, a push to either ran the whole suite
  # twice: once from this trigger and once as a called job.
  #
  # paths-ignore covers this trigger and pull_request only, never workflow_call
  # — a release always runs the full suite whatever it touched.
  push:
    branches-ignore:
      - develop
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-APACHE'
      - 'NOTICE'
      - '.gitignore'
  workflow_call:
jobs:
  tests:
    name: parse (PHP ${{ matrix.php-versions }})
    strategy:
      # One version failing must not cancel the others: knowing a file parses on
      # 8.3 but not on 8.5 is the entire point of running more than one.
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: [ '8.3', '8.4', '8.5' ]
        experimental: [false]
        include:
          # Unreleased PHP, for information only. It reports what is coming --
          # a construct deprecated in the next version, or one already removed
          # -- without a build breaking because upstream changed something in
          # a build nobody runs in production yet.
          - operating-system: ubuntu-latest
            php-versions: 'nightly'
            experimental: true
    runs-on: ${{ matrix.operating-system }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
      # Fails on a parse error, reports deprecations without failing. `php -l`
      # already draws that line by exit code; what it does not do is separate
      # them in its output, so across a thousand files the deprecations were
      # printed and lost. See tests/php-lint.sh.
      - name: Parse check
        run: bash tests/php-lint.sh

  # Characterization tests for the DAO base layer and the models built on it.
  # These pin observable behaviour against a live database so that rewriting a
  # model's query layer is provably behaviour-preserving.
  model-contracts:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DRIFT_DB_HOST: 127.0.0.1
      DRIFT_DB_PORT: 3306
      DRIFT_DB_USER: root
      DRIFT_DB_PASS: root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
      # oc-includes/vendor/ is committed (releases are cut with git archive and
      # run no build step), so the autoloader is present straight from checkout.
      - name: Params typed accessors
        run: php tests/params-typed-accessors.php
      # Storefront -- the default theme -- keeps its chrome in common/, so a probe
      # for a root header.php/footer.php missed on a default install and every
      # core-rendered page dropped to the standalone shell.
      - name: Theme chrome resolution
        run: php tests/theme-chrome.php
      # The reserved view names guard static-page slugs, and both directions are
      # silent: a name added forbids a slug live sites already use, and one dropped
      # lets a page shadow the route of the same name and quietly stop resolving.
      - name: Theme view names
        run: php tests/theme-views.php
      # Controllers now name a list of views rather than one, and the two orderings
      # have to resolve theme-first: if candidate order won outright, a fallback
      # theme's specific view would beat the active theme's generic one and the
      # visitor would silently get a page from a theme the site is not running.
      - name: Template hierarchy
        run: php tests/template-hierarchy.php
      # osc_head() ends by running the `header` hook, which carries every enqueued
      # asset and the robots meta. Running it twice ships every asset twice and
      # dropping it ships an unstyled page — the page renders through either way.
      - name: Head and body ownership
        run: php tests/theme-head.php
      - name: Captcha posted token
        run: php tests/captcha-posted-token.php
      - name: Rewrite param decode
        run: php tests/rewrite-param-decode.php
      - name: Rewrite route match
        run: php tests/rewrite-route-match.php
      - name: Rewrite resolve rewrite
        run: php tests/rewrite-resolve-rewrite.php
      - name: Item URL characterization
        run: php tests/item-url-characterization.php
      - name: Pagination
        run: php tests/pagination.php
      # The location sitemaps synthesise URLs while the sitemap route's own params are
      # still in the request; one leaking in silently doubles every category-location
      # page into a second, self-canonicalising URL that Google indexes separately.
      - name: Sitemap search URLs
        run: php tests/sitemap-search-url.php
      # A token in a GET form lands in the query string: shared in links, kept in
      # referrers, and unique per visitor, so every search URL becomes its own cache
      # entry. Skipping a POST form is worse -- its action rejects every submission.
      - name: CSRF form injection
        run: php tests/csrf-form-injection.php
      # Comments are on by default, so a renamed field or a dropped hook here breaks
      # posting on every theme that uses core's block, with nothing to see on the page.
      - name: Item comments view
        run: php tests/item-comments-view.php
      # The edit form posts title[<locale>]. Report the wrong one and saving copies the
      # text it was showing into a second locale, leaving the original untranslated --
      # once per edit, with nothing to see on the page.
      - name: Item content locale
        run: php tests/item-content-locale.php
      # A description that leads with the category blurb reads fine on one page and is a
      # duplicate across every city in that category -- the part that differs sits past
      # where a search engine stops reading.
      - name: Meta description
        run: php tests/meta-description.php
      # Both directions are silent: a facet param left in the canonical makes every price
      # and custom-field permutation its own indexable URL, and one dropped too many points
      # two different result sets at the same canonical, de-indexing one of them.
      - name: Canonical params
        run: php tests/canonical-params.php
      # Resolving sCategory by slug alone 404s a category that exists whenever the value
      # is an id -- which is what osc_search_url() emits and what a category <select> submits.
      - name: Search category resolution
        run: php tests/search-category-resolve.php
      # A page built from blocks rendered through the theme's root header.php, which is not
      # part of the view contract -- the page shipped as a fragment with no <head> at all.
      - name: Page builder render
        run: php tests/page-builder-render.php
      # user_menu_filter is the only way a plugin reaches the account menu, and a wrong
      # order there is silent -- the entry renders, just under the log-out row.
      - name: Account menu order
        run: php tests/user-menu-order.php
      # Core's fallback pages for the account section render only when the theme ships
      # no view of its own, so every break here is invisible on the themes we run: a
      # renamed partial is a blank page again, and a renamed .oe-* class strands every
      # theme styling the published name.
      - name: Account fallback views
        run: php tests/account-views.php
      # GET ?page=user&action=delete&id=&secret= used to remove the account as soon
      # as the page was requested. The confirm view must not call deleteUser.
      - name: Account delete is POST
        run: php tests/user-delete-get.php
      # An unrouted settings action does not error -- it renders a different settings page
      # and discards the post, so the only symptom is preferences that never save.
      - name: Admin settings routes
        run: php tests/admin-settings-routes.php
      # The editor config was copied into five call sites; when TinyMCE made license_key
      # mandatory, four were updated and the public one was not -- and it stops loading.
      - name: TinyMCE config
        run: php tests/tinymce-config.php
      # A listing description is stored with Params' XSS check off, so the allow-list is
      # the only thing between a poster and script running for every visitor.
      - name: Rich-text sanitiser
        run: php tests/sanitize-html.php
      # Auto-cron's three decisions -- run in-process on FPM, after the response, under a
      # bounded time limit -- are one small block that is easy to undo while tidying.
      - name: Auto-cron dispatch
        run: php tests/autocron-dispatch.php
      # The only signal a proxy or CDN gets that a listing's page went stale -- including
      # after a storage offload rewrites its image URLs, which fires nothing else.
      - name: Item cache invalidation hook
        run: php tests/item-cache-invalidation.php
      # The validator masks the CSRF pair so it survives a fresh token. Masking a
      # character too much and an edited page keeps its ETag, which serves stale content.
      - name: Response ETag
        run: php tests/response-etag.php
      # A form that validates addresses on its own drifts: the comment form refused every
      # .info and .online address for years while accepting a local part with a space in it.
      - name: Email validation
        run: php tests/validate-email.php
      - name: Typed-row parity
        run: php tests/db-typed-rows.php
      - name: Secret-comparison regression
        run: php tests/security-secret-coercion.php
      # Both directions of a wrong cookie allowlist are silent: a name no setcookie()
      # writes never matches at the proxy, and a missing one lets a personalized page be
      # stored under a URL whose cache key has no such component.
      - name: Cache cookie contract
        run: php tests/cache-cookie-contract.php
      - name: DAO contract
        run: php tests/dao-contract.php
      - name: Model contracts
        run: php tests/run-models.php
      - name: Delete cascades
        run: php tests/delete-cascade.php
      # The upgrade screen and upgradeDB() are replaced at different moments — an
      # opcode cache can serve the previous class behind the new template — so the
      # screen has to stay truthful when the answer predates it.
      - name: Upgrade payload contract
        run: php tests/upgrade-payload-contract.php
      # Needs no database or network: the catalog's pointer and its manifest both carry a
      # `countries` key, and telling them apart on presence rather than type has broken
      # the catalog twice, both times hidden by a warm cache.
      - name: Location catalog shapes
        run: php tests/location-catalog-shapes.php
      # Identity is the upstream id; names are the fallback that carries a place across a
      # change of source. Both halves are easy to get subtly wrong -- a row that counts as
      # ambiguous with itself matches nothing and re-imports a whole country, and a name
      # shared by 117 villages matching one of them retires the other 116.
      - name: Location matching
        run: php tests/location-matching.php
