      # screen has to stay truthful when the answer predates it.
      - name: Upgrade payload contract
        run: php tests/upgrade-payload-contract.php
      - name: Upgrade release zip
        run: php tests/upgrade-release-zip.php
      - name: Upgrade clears OPcache
        run: php tests/upgrade-opcache-reset.php
      - name: Upgrade stops on unwritable files
        run: php tests/upgrade-unwritable.php
      - name: Shared helpers (notices, actor, PHP user, filtered iterator)
        run: php tests/shared-helpers.php
      - name: New classes declare strict types
        run: php tests/strict-types.php
      - name: Update channel and automatic security install
        run: php tests/update-channel.php
      - name: Edge builds
        run: php tests/edge-build.php
