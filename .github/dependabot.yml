# Dependency update PRs.
#
# Security alerts arrive with or without this file; what it adds is routine version
# updates, and which manifests they are opened against.
#
# Every ecosystem targets develop; master only ever receives a release merge.
#
# Generated files (vendor, assets, compiled admin CSS and JS) are not in git, so every
# Dependabot PR is complete as it arrives. CI and the release build them.
#
version: 2

updates:
  # Workflow actions.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The formatting and PHP-floor linters. tools/lint/vendor is not committed — CI
  # installs it.
  - package-ecosystem: composer
    directory: /tools/lint
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(lint)"
    groups:
      linters:
        patterns:
          - "*"

  # Runtime libraries. Kept ungrouped and to a low limit deliberately, so each bump is reviewed on its own.
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    ignore:
      # Pinned to a minor line in composer.json on purpose; a major is a migration,
      # not an update, and should be opened by hand when someone intends to do it.
      - dependency-name: ezyang/htmlpurifier
        update-types: ["version-update:semver-major"]
      - dependency-name: phpseclib/phpseclib
        update-types: ["version-update:semver-major"]
      - dependency-name: pclzip/pclzip
        update-types: ["version-update:semver-major"]
      - dependency-name: gettext/gettext
        update-types: ["version-update:semver-major"]

  # Build toolchain and the vendored front-end libraries.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      # Build-only, and nothing of theirs is copied into the tree.
      build-tooling:
        patterns:
          - esbuild
          - eslint
          - sass-embedded
          - gettext-parser
    ignore:
      # jQuery and its plugins are on the way out rather than being kept current, and
      # a bump would only enlarge what has to be removed.
      - dependency-name: jquery
      - dependency-name: jquery-ui-dist
      - dependency-name: jquery-validation
      # Bootstrap majors move class names, which are a published API here.
      - dependency-name: bootstrap
        update-types: ["version-update:semver-major"]

  # The production image's base.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
