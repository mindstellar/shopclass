# Production-style stack: the self-contained Shopclass image plus a database.
# One command brings up a working, already-installed site:
#
#   docker compose -f docker-compose.prod.yml up --build
#   open http://localhost:8080   (admin at /oc-admin/, from the OSC_ADMIN_* below)
#
# For a real deployment, point at a managed database, set a strong admin password
# (or omit OSC_ADMIN_PASSWORD to have one generated and printed in the logs), set
# WEB_PATH to the public URL, and offload uploads to S3 for multi-instance scaling.
name: shopclass-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Or pull a published image instead of building:
    # image: ghcr.io/mindstellar/shopclass:latest
    ports:
      - "8080:80"
    environment:
      OSC_IGNORE_CONFIG_FILE: "1"
      DB_HOST: db
      DB_NAME: shopclass
      DB_USER: shopclass
      DB_PASSWORD: shopclass
      WEB_PATH: http://localhost:8080/
      OSC_SITE_TITLE: Shopclass
      OSC_ADMIN_USER: admin
      OSC_ADMIN_EMAIL: admin@example.com
      OSC_ADMIN_PASSWORD: changeme
      # Cache public pages in nginx for as long as the app says they may be held —
      # thirty seconds by default, and the app is the only thing that decides what is
      # cacheable at all. Install the nginx-cache plugin to hold them for longer and
      # purge them when a listing changes; the image already carries the module and
      # writes the purge location this switch turns on.
      OSC_MICROCACHE: "1"
    volumes:
      - uploads:/application/oc-content/uploads
      - downloads:/application/oc-content/downloads
      # Persist installed/updated plugins and themes across redeploys. A fresh
      # volume is seeded from the image on first start; after that the
      # entrypoint's package:reconcile keeps the bundled ones current on every
      # start without touching anything installed through the market — see the
      # Dockerfile and PackageReconciler.
      #
      # Upgrading from an image that predates these two volumes: copy the two
      # directories out of the running container first. The new volumes are
      # seeded from the image, so anything installed into the old container's
      # writable layer is not carried across and cannot be recovered after the
      # old container is gone.
      - plugins:/application/oc-content/plugins
      - themes:/application/oc-content/themes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Kept in step with the dev stack's `mariadb` service by hand.
  db:
    image: mariadb:11
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      MARIADB_DATABASE: shopclass
      MARIADB_USER: shopclass
      MARIADB_PASSWORD: shopclass
      MARIADB_ROOT_PASSWORD: root
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  downloads:
  plugins:
  themes:
