# Reference reverse-proxy micro-cache for Shopclass public pages.
#
# This is the canonical proxy config referenced by the caching contract. It is intentionally
# small and domain-independent: the application states public-vs-private in its Cache-Control
# header (respected here because fastcgi_ignore_headers is NOT set), so this file only has to
# make the one decision a proxy must make before the app runs — "may I serve a cached page to
# THIS request?" — and it keys that on the app's own personalization cookies, nothing else.
#
# It is a reference, not wired into the bundled dev server (local development stays uncached).
# To use it on a real deployment: put the two http-scope directives below in http{} (e.g. drop
# this file into conf.d/), then paste the location-scope block into your `location ~ \.php$`.

# --- http{} scope ---------------------------------------------------------------------------

fastcgi_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=MICROCACHE:10m
                   max_size=200m inactive=60s use_temp_path=off;

# Bypass the cache ONLY when the request carries one of core's personalization cookies. Every
# other cookie is ignored on purpose — third-party analytics/ads (`_ga`, `_gid`, `__gads`,
# `__gpi`, `_fbp`, ...) and the theme's consent cookie are set client-side, never read by the
# server, and must not defeat the cache. Matching cookie *presence* ("any cookie") would let a
# single Analytics cookie make every real visitor a cache miss.
#
# oc_cache_bypass is a fixed-name flag the app sets whenever a visitor carries identity state (its
# identity cookie is named md5(WEB_PATH), which this config cannot hardcode, so the app exposes this
# stable public signal instead); oc_userLocale is the chosen front-end language, which changes the
# rendered body on a URL that has no language in its cache key; osclass/PHPSESSID cover an active
# PHP session. All fixed and domain-independent — keep them in sync with the caching contract
# (osc_cache_relevant_cookies).
map $http_cookie $mc_private {
    default 0;
    "~(^|;\s*)(oc_cache_bypass|oc_userLocale|osclass|PHPSESSID)=" 1;
}

# --- location ~ \.php$ scope ----------------------------------------------------------------
#
#     fastcgi_cache            MICROCACHE;
#     fastcgi_cache_key        "$scheme$request_method$host$request_uri";
#     fastcgi_cache_bypass     $mc_private;   # don't SERVE a cached page to a personalized request
#     fastcgi_no_cache         $mc_private;   # don't STORE a personalized response
#     fastcgi_cache_lock       on;
#     fastcgi_cache_use_stale  updating error timeout http_500 http_503;
#     fastcgi_cache_background_update on;
#     add_header X-Cache $upstream_cache_status always;
#
# Deliberately NOT set, so the application stays the authority:
#   - no `fastcgi_ignore_headers` — the app's Cache-Control (public s-maxage / private no-store)
#     decides what is stored and for how long; a session-starting page emits `private, no-store`
#     and is never stored even on a public URL;
#   - no `fastcgi_cache_valid` override — the store window comes from the app's `s-maxage`;
#   - no synthesized Cache-Control map and no URL allow/deny maps — the app already knows which
#     pages are public (it calls osc_mark_response_cacheable()); sibling routes under one prefix
#     (public `user/items` vs private `user/dashboard`) differ, so a URL regex cannot classify them.
#
# nginx caches only GET/HEAD by default, so no request-method gate is needed.

# --- server{} scope, only if entries need removing before their window is up ---------------
#
# Time is the only eviction above, which is why the app's window is thirty seconds. To hold
# a page for longer, something has to be able to say "this one is wrong now" — that is the
# nginx-cache plugin, and this is the endpoint it calls. It needs nginx built with
# ngx_cache_purge (an Alpine package, `nginx-mod-http-cache-purge`; not in the official
# Docker image), and `inactive=` above raised to match the longest window you intend to
# hand out, or an entry nobody asks for is evicted after a minute anyway.
#
#     location ~ ^/purge(/.*)$ {
#         allow 127.0.0.1;
#         deny all;
#         fastcgi_cache_purge MICROCACHE "$scheme$request_method$host$1$is_args$args";
#     }
#
# $1 is the path being purged and $is_args$args its query, so the key is the same one
# fastcgi_cache_key filed the page under. Those two drifting apart is the failure that
# reports nothing: a purge computing a different key answers 412, exactly as it does for a
# page that was never cached. The plugin's own self-test is what catches it.
#
# A purge carries no credentials, so the allow list is the whole of the access control.
