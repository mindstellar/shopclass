# Single-container production nginx: serves /application and hands .php to the
# php-fpm running alongside it (127.0.0.1:9000). Logs go to stdout/stderr for the
# container runtime to collect.
# Dynamic modules. This file replaces Alpine's own nginx.conf, which carries this
# include, so without it a module installed by apk is present on disk and never
# loaded — and nginx refuses to start the moment anything uses one of its
# directives. That is how the purge location below fails if this line goes.
include /etc/nginx/modules/*.conf;

user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 108M;
    # nchan adds its own variables; the default table is too small to hash them well.
    variables_hash_max_size 2048;

    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Browser cache for static files. A ?v= URL changes when the file does, so it keeps for a year;
    # plugins and themes often link without one, so those keep for an hour (code) or a week (media).
    map $arg_v $osc_code_expires {
        ""      1h;
        default 1y;
    }
    map $arg_v $osc_media_expires {
        ""      7d;
        default 1y;
    }

    # Sets $fcgi_https, the HTTPS flag PHP sees. By default it trusts X-Forwarded-Proto
    # from a proxy in front; with OSC_TLS_DOMAIN there is no proxy, so tls.sh writes a
    # version that trusts only this nginx's own HTTPS.
    include /etc/nginx/https_map.conf;
    # Optional: restore the real client IP from a trusted proxy (Cloudflare tunnel,
    # load balancer) so REMOTE_ADDR — which login throttling and abuse keying rely
    # on — is the visitor, not the proxy. The entrypoint generates this from
    # OSC_REAL_IP_HEADER / OSC_REAL_IP_TRUSTED; the file is empty (no-op) by default.
    include /etc/nginx/real_ip.conf;

    # Optional: the public-page micro-cache and the request rate limit, generated by
    # the entrypoint from OSC_MICROCACHE / OSC_RATE_LIMIT, empty (no-op) by default.
    # Both need a directive in http{} and another inside the PHP location, hence the
    # pair of includes; leaving them off changes nothing.
    #
    # Keeping them here rather than applied by hand on a host is the point: a
    # configuration edited inside a running container is lost the moment the
    # container is replaced, which is every deploy.
    #
    # Both rate-limit keys and cache-bypass decisions read the client address, so
    # this deliberately follows the real_ip include above — the limit must count the
    # visitor, not the proxy in front of it.
    include /etc/nginx/microcache_http.conf;

    # With OSC_TLS_DOMAIN: the port 80 server that sends visitors to HTTPS, and the
    # redirects from OSC_TLS_REDIRECT_FROM. Written by tls.sh; empty otherwise.
    include /etc/nginx/tls_http.conf;

    # Live messages: nchan's memory, Valkey sharing and the loopback publisher on port
    # 8090. Written by the entrypoint from OSC_LIVE; empty (no nchan directive) when off.
    include /etc/nginx/live_http.conf;

    server {
        # Port 80, or port 443 once tls.sh has a certificate.
        include /etc/nginx/listen.conf;

        root /application;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # nginx's default mime.types has no .xsl mapping, so the sitemap
        # stylesheets would be octet-stream and browsers wouldn't apply them.
        location ~* \.xsl$ {
            default_type text/xsl;
        }

        # Let's Encrypt's domain check; tls.sh writes the answer files here.
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/acme-webroot;
            default_type text/plain;
        }

        # The purge location, generated by the entrypoint alongside the micro-cache
        # and empty without it. Reachable only from inside the container, because a
        # purge carries no credentials.
        include /etc/nginx/microcache_server.conf;

        # The live-message stream /live/sub/user-<id> and its authorise call. Written
        # with live_http.conf above and empty with it.
        include /etc/nginx/live_server.conf;
        # Whatever the include above does not answer, live off included, is a 404 here,
        # not a page from the app. Its regex locations still win over these prefixes.
        location /live/sub/ {
            return 404;
        }
        location /live/pub/ {
            return 404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $fcgi_https;
            include fastcgi_params;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 300;

            # The other half of the micro-cache / rate-limit pair above. Empty
            # unless the entrypoint wrote it.
            include /etc/nginx/microcache_php.conf;
        }

        # Basic hygiene: never serve dotfiles (except ACME challenges) or the
        # config file directly.
        location ~ /\.(?!well-known) {
            deny all;
        }
        location = /config.php {
            deny all;
        }
        # HTMLPurifier's definition cache; its .htaccess only works on Apache.
        location ~ /oc-content/uploads/purifier- {
            deny all;
        }
        # Test and build scripts are not part of the site.
        location ^~ /tests/ {
            deny all;
        }
        location ^~ /scripts/ {
            deny all;
        }
        # debug.log and queries.log are written here when OSC_DEBUG_LOG is on.
        location ~* ^/oc-content/.*\.log$ {
            deny all;
        }
        # Backups and package downloads hold the database; never serve them.
        location ^~ /oc-content/downloads/ {
            deny all;
        }
        # Plugins keep their own files here.
        location ^~ /oc-content/plugin-data/ {
            deny all;
        }
        # After the deny rules: regex locations match in order. A missing file still reaches PHP,
        # which a plugin may answer, and that answer takes the PHP location's headers.
        location ~* \.(?:css|js|mjs)$ {
            expires $osc_code_expires;
            try_files $uri /index.php?$query_string;
        }
        location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
            expires $osc_media_expires;
            try_files $uri /index.php?$query_string;
        }
    }
}
