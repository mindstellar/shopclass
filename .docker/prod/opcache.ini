; Production OPcache. The image is immutable — code only changes by deploying a
; new image, which is a fresh container with a cold cache — so timestamp
; validation is off (no per-request stat) for maximum throughput.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
