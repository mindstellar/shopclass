# Shared MariaDB definition for the dev (docker-compose.yml) and prod
# (docker-compose.prod.yml) stacks. Each stack extends this service and layers on
# its own specifics — container name, published port, restart policy, credentials.
#
# This is NOT a standalone stack: nothing here starts on its own. It is pulled in
# through `extends:`, which copies only the referenced service, so the two stacks
# keep their distinct shapes while sharing one image, healthcheck and data volume.
services:
  mariadb:
    image: mariadb:11
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

# Declared so this file validates on its own; the extending stacks declare their
# own db-data volume (extends copies the mount, not top-level volumes).
volumes:
  db-data:
